name: 🔒 Security & Code Quality Scan

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===== JOB 1 : SECRET SCANNING =====
  secrets-scan:
    name: 🔑 Scan for Secrets & API Keys
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret detection

      # TruffleHog - Détecte les clés, tokens, credentials
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before || 'HEAD~1' }}
          head: HEAD
          extra_args: --debug --json
        continue-on-error: true

      # GitGuardian - Scan avancé des secrets (optionnel si API key configurée)
      - name: GitGuardian Secret Scan
        run: |
          pip install gitguardian
          ggshield secret scan repo --json --exit-code FAIL . 2>&1 || true
        continue-on-error: true
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  # ===== JOB 2 : SAST (Static Analysis Security Testing) =====
  sast-scan:
    name: 🔍 SAST with Bandit & Semgrep
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "Warning: requirements.txt not found, installing minimal dependencies"
            pip install bandit semgrep pylint requests beautifulsoup4 selenium
          fi
          pip install bandit semgrep pylint

      # Bandit - Python Security Scanner
      - name: Bandit Security Check
        run: |
          bandit -r agents core -f json -o bandit-report.json || true
          bandit -r agents core -f txt
        continue-on-error: true

      - name: Upload Bandit Report
        if: always() && hashFiles('bandit-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
        continue-on-error: true

      # Semgrep - Pattern-based security scanner
      - name: Semgrep Security Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/python
            p/owasp-top-ten
            p/cwe-top-25
          generateSarif: true
        continue-on-error: true

      - name: Upload SARIF report
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
        continue-on-error: true

  # ===== JOB 3 : SCA (Software Composition Analysis) =====
  sca-scan:
    name: 📦 Dependency Check (SCA)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "Warning: requirements.txt not found, installing minimal dependencies"
            pip install requests beautifulsoup4 selenium
          fi

      # Safety - Check Python dependencies for vulnerabilities
      - name: Safety Dependency Check
        run: |
          pip install safety
          safety check --json > safety-report.json || true
          safety check
        continue-on-error: true

      - name: Upload Safety Report
        if: always() && hashFiles('safety-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: safety-report.json
        continue-on-error: true

  # ===== JOB 4 : CODE QUALITY =====
  code-quality:
    name: 📊 Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "Warning: requirements.txt not found, installing minimal dependencies"
            pip install requests beautifulsoup4 selenium
          fi
          pip install black isort flake8 pylint

      # Black - Code formatting
      - name: Black Code Formatting Check
        run: |
          black --check agents core || echo "Warning: Run black agents core to fix"
        continue-on-error: true

      # isort - Import sorting
      - name: isort Import Check
        run: |
          isort --check-only agents core || echo "Warning: Run isort agents core to fix"
        continue-on-error: true

      # Flake8 - Style guide
      - name: Flake8 Lint Check
        run: |
          flake8 agents core --count --select=E9,F63,F7,F82 --show-source --statistics || true
          flake8 agents core --count --exit-zero --max-complexity=10 --max-line-length=127
        continue-on-error: true

      # Pylint - Comprehensive analysis
      - name: Pylint Code Analysis
        run: |
          pylint agents core --exit-zero --output-format=json > pylint-report.json || true
          pylint agents core --exit-zero
        continue-on-error: true

      - name: Upload Pylint Report
        if: always() && hashFiles('pylint-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pylint-report
          path: pylint-report.json
        continue-on-error: true

  # ===== JOB 5 : UNIT TESTS & COVERAGE =====
  tests:
    name: ✅ Unit Tests & Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "Warning: requirements.txt not found, installing minimal dependencies"
            pip install requests beautifulsoup4 selenium
          fi
          pip install pytest pytest-cov pytest-xdist

      - name: Run Unit Tests with Coverage
        run: |
            pytest tests/ \
            --cov=agents \
            --cov=core \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --junitxml=junit.xml \
            -v || echo "Warning: No tests directory found yet"
        continue-on-error: true

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            junit.xml
            htmlcov/
        continue-on-error: true
        # Ne pas échouer si les fichiers n'existent pas
        if-no-files-found: ignore

  # ===== JOB 6 : QUALITY GATE =====
  quality-gate:
    name: 🎯 Quality Gate Check
    runs-on: ubuntu-latest
    needs: [secrets-scan, sast-scan, sca-scan, code-quality, tests]
    
    if: always()
    
    steps:
      - name: Check Job Status
        run: |
          echo "Checking all previous job results..."
          
          if [ "${{ needs.secrets-scan.result }}" == "failure" ]; then
            echo "❌ Secret scanning failed"
            exit 1
          fi
          
          if [ "${{ needs.sast-scan.result }}" == "failure" ]; then
            echo "Warning: SAST scan had issues (check logs)"
          fi
          
          if [ "${{ needs.sca-scan.result }}" == "failure" ]; then
            echo "Warning: SCA scan had issues (check logs)"
          fi
          
          if [ "${{ needs.tests.result }}" == "failure" ]; then
            echo "Warning: Tests had issues (check logs)"
          fi
          
          echo "✅ Quality gate check completed!"

      - name: Add PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Security and quality checks completed!\n\n**Scans performed:**\n- 🔑 Secret scanning\n- 🔍 SAST analysis (Bandit + Semgrep)\n- 📦 Dependency check (Safety)\n- 📊 Code quality (Black + isort + Flake8 + Pylint)\n- ✅ Unit tests\n\nCheck the Actions tab for detailed results.'
            })
        continue-on-error: true

